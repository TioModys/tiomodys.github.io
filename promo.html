<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aviso</title>
<style>
:root{--card:#150f2b;--card2:#0e0b1f;--line:#3a2f6b;--ring:#7c5cff;--gold:#ffc21a;--txt:#ece8ff;--muted:#8f84c9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:transparent;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--txt);-webkit-user-select:none;user-select:none}
body{display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.card{width:100%;max-width:380px;max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch;background:linear-gradient(180deg,var(--card),var(--card2));border:1.5px solid var(--line);border-radius:28px;padding:24px 20px 20px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.logo{width:92px;height:92px;border-radius:50%;border:3px solid var(--ring);background:radial-gradient(circle at 50% 38%,#26402a,#0d1117 72%);display:block;margin:0 auto 14px;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain;padding:9px;display:block}
h1{margin:0;font-size:27px;letter-spacing:.5px}
.sub{margin:4px 0 14px;color:var(--muted);font-size:15px}
.gl{height:3px;margin:0 8px 16px;background:linear-gradient(90deg,transparent,var(--gold),transparent);border-radius:3px}
.msg{border:1.5px solid var(--line);border-radius:20px;padding:16px 14px;font-size:16px;line-height:1.45}
.tog{display:flex;align-items:center;gap:14px;margin:14px 0;padding:10px 16px;border:1.5px solid var(--line);border-radius:999px;color:var(--muted);font-size:15px;cursor:pointer}
.sw{width:44px;height:24px;border-radius:12px;background:#241c47;position:relative;flex:none;transition:.2s}
.sw:after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#e9e5ff;transition:.2s}
.tog.on .sw{background:var(--ring)}
.tog.on .sw:after{left:22px}
.fol{margin:18px 0 10px;font-size:12px;font-weight:800;letter-spacing:1px;color:#9a93c2}
.soc{display:flex;justify-content:center;gap:14px;margin-bottom:18px}
.soc a{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #ffffff44}
.soc a.t{background:#229ed9}
.soc a.w{background:#25d366}
.soc a.k{background:#111}
.soc svg{width:26px;height:26px;fill:#fff}
.btns{display:flex;gap:12px}
.btn{flex:1;display:block;padding:14px 8px;border-radius:999px;background:#1d1540;border:1.5px solid var(--line);color:#fff;font-weight:800;font-size:16px;text-decoration:none}
.btn.p{background:linear-gradient(135deg,#7c5cff,#5a3bd6)}

/* ===== Pantallas horizontales (apps y juegos en landscape): dos columnas para que todo quepa ===== */
@media (orientation:landscape){
  body{padding:max(8px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
  .card{max-width:720px;display:grid;grid-template-columns:1fr 1fr;column-gap:20px;align-items:center;padding:14px 18px;border-radius:22px}
  .logo{width:60px;height:60px;margin-bottom:6px;border-width:2px}
  .logo img{padding:6px}
  h1{font-size:22px}
  .sub{margin:2px 0 8px;font-size:13px}
  .gl{margin:0 8px 10px}
  .msg{padding:10px 12px;font-size:13.5px;line-height:1.35;border-radius:16px}
  .tog{margin:0 0 8px;padding:7px 14px;font-size:13px}
  .fol{margin:6px 0 6px;font-size:11px}
  .soc{gap:12px;margin-bottom:10px}
  .soc a{width:42px;height:42px}
  .soc svg{width:21px;height:21px}
  .btn{padding:11px 6px;font-size:14px}
}
@media (orientation:landscape) and (max-height:330px){
  .card{padding:10px 16px}
  .logo{width:48px;height:48px;margin-bottom:4px}
  h1{font-size:19px}
  .sub{font-size:12px;margin:0 0 6px}
  .gl{margin:0 8px 8px}
  .msg{font-size:12.5px;padding:8px 10px}
  .tog{padding:5px 12px;font-size:12px;margin-bottom:6px}
  .soc a{width:36px;height:36px}
  .soc svg{width:18px;height:18px}
  .btn{padding:9px 6px;font-size:13px}
}
</style></head>
